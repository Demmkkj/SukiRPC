plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    sourceSets.main.java.srcDir(rootProject.file('shared/artwork/src/main/java'))
    // SUKIRPC_SIGNING
    signingConfigs {
        debug {
            storeFile file(System.getenv('SUKI_QUALITY_KEYSTORE') ?: System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Preserve existing installed certificate for this private RC.
            signingConfig signingConfigs.debug
            debuggable false
            def optimize = (project.findProperty('sukiR8') ?: 'false').toString().toBoolean()
            minifyEnabled optimize
            shrinkResources optimize
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            merges += [
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    namespace 'dev.nuvio.presence'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'dev.nuvio.presence'
        minSdk 26
        targetSdk 35
        versionCode (1000 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger())
        versionName '2.1.2'
        ndk {
            def requested = (project.findProperty('sukiAbis') ?: 'arm64-v8a').toString().split(',').collect { it.trim() }
            if (requested.any { !(it in ['arm64-v8a','armeabi-v7a','x86','x86_64']) }) throw new GradleException('ABI invalida: ' + requested)
            abiFilters.addAll(requested)
        }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17'
            arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        } }
    }
    buildFeatures { prefab true; compose true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation files('libs/discord_partner_sdk.aar')
    implementation('dev.mobile:dadb:1.2.6') {
        exclude group: 'org.graalvm.buildtools', module: 'junit-platform-native'
        exclude group: 'org.junit.platform'
        exclude group: 'org.junit.jupiter'
        exclude group: 'org.junit.vintage'
    }
    implementation platform('androidx.compose:compose-bom:2025.03.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    // Haze 1.3.1 uses Compose 1.7.7 / Kotlin 2.1.0.
    implementation 'dev.chrisbanes.haze:haze:1.3.1'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
}

// The CI build generates this asset from the matching Collector source.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/collectorAssets'))

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}




apply from: rootProject.file('scripts/quality/app.gradle')
