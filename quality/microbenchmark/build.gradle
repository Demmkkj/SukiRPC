plugins {
    id 'com.android.library'
    id 'androidx.benchmark' version '1.3.4'
}
android {
    namespace 'dev.nuvio.quality.microbenchmark'
    compileSdk 35
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.benchmark.junit4.AndroidBenchmarkRunner'
    }
    testBuildType = 'release'
    sourceSets.main.java.srcDir rootProject.file('shared/artwork/src/main/java')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.benchmark:benchmark-junit4:1.3.4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
