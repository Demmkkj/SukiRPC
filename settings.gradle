pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'SukiRPC'
include ':app', ':collector'

if (providers.gradleProperty('sukiBenchmarks').isPresent()) {
    include ':quality:macrobenchmark', ':quality:microbenchmark'
}
if (providers.gradleProperty('sukiVisual').isPresent()) {
    include ':quality:visual'
}
