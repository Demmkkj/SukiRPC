import org.gradle.testing.jacoco.tasks.JacocoReport

plugins {
    id 'com.android.application'
}
android {
    sourceSets.main.java.srcDir(rootProject.file('shared/artwork/src/main/java'))
    lint {
        disable += 'ExpiredTargetSdkVersion'
    }

    // SUKIRPC_SIGNING
    signingConfigs {
        debug {
            storeFile file(System.getenv('SUKI_QUALITY_KEYSTORE') ?: System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Preserve existing installed certificate for this private RC.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    namespace 'dev.nuvio.collector'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.nuvio.collector'
        minSdk 26
        targetSdk 28
        versionCode (1000 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger())
        versionName '2.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}


apply from: rootProject.file('scripts/quality/jvm.gradle')

if (providers.gradleProperty('sukiCoverage').isPresent()) {
    apply plugin: 'jacoco'
    jacoco.toolVersion = '0.8.13'
    tasks.register('collectorCoverageReport', JacocoReport) {
        dependsOn 'testDebugUnitTest'
        executionData layout.buildDirectory.file('jacoco/testDebugUnitTest.exec')
        classDirectories.from(fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) {
            exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class'
        })
        sourceDirectories.from(android.sourceSets.main.java.srcDirs)
        reports {
            xml.required = true
            xml.outputLocation = layout.buildDirectory.file('reports/jacoco/collector.xml')
            html.required = false
        }
    }
}
